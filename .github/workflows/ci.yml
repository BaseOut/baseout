name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, typecheck, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate lat.md graphs
        run: scripts/lat-check-all.sh

      # The wrangler configs' secrets.required lists and the cron→dispatch map
      # both claim CI enforcement — these two steps make that claim true.
      - name: Check wrangler secrets parity
        run: pnpm secrets:check

      - name: Check cron triggers match dispatch map
        run: pnpm cron:check

      - name: Render wrangler.jsonc (apps/web)
        working-directory: apps/web
        run: node scripts/launch.mjs render-config

      - name: Generate Cloudflare types (apps/web)
        run: pnpm --filter @baseout/web cf-typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Web unit tests
        run: pnpm --filter @baseout/web test:unit

      - name: Build Storybook (apps/web)
        run: pnpm --filter @baseout/web build-storybook

  # Cloudflare Workers Builds (Deploy from GitHub) handles deployment after merge.
  # Each Cloudflare Workers project is configured in the dashboard with a root
  # directory (e.g., apps/web) and watch paths so only the affected app deploys
  # when its files (or its workspace dependencies) change. No deploy job here.
