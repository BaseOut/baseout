# CodeQL code scanning — Input Validation / SSDLC evidence (SOC 2 CC7.1, CC8.1).
# Produces the code-scanning analysis the Comp AI `code_scanning` /
# `sanitized_inputs` checks look for. JS/TS is interpreted, so no build step is
# needed. See shared/internal/comp-ai-policies/secure-development.md.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1" # weekly, Monday 04:27 UTC

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
