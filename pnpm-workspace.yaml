packages:
  - "apps/*"
  # apps/embed is an umbrella of per-host packages (embed change, design
  # Decision 1). The two Airtable extension hosts are EXCLUDED on purpose:
  # the Airtable blocks CLI owns their install/run lifecycle and their React
  # peer set must not constrain the monorepo — they consume @baseout/embed-core
  # via a file: dependency instead.
  - "apps/embed/*"
  - "!apps/embed/airtable-data"
  - "!apps/embed/airtable-interface"
  - "packages/*"

# Transitive-dependency version pins to clear Dependabot high CVEs
# (system-dep-remediation-2: post-consolidation re-apply + extend). pnpm 10+
# reads `overrides` from THIS file, not package.json's pnpm.overrides — the
# pnpm 9->11 upgrade silently orphaned the package.json block, which is the
# root cause of the CVE regression. Same-major only; every target verified
# >=7 days old so the minimumReleaseAge gate below is satisfied.
# Deferred (need code migrations, tracked as follow-ups): drizzle-orm
# (db-schema 0.36->0.45) and product/website majors (astro 5->6).
# undici@5.29.0 RESOLVED 2026-08-12: bumping apps/sql wrangler ^3->^4 dropped
# the wrangler@3/miniflare@3/undici@5.29.0 subtree (last wrangler-3 consumer).
overrides:
  fast-uri: "^3.1.5"
  ip-address: "^10.3.1"
  hono: "^4.12.34"
  svgo: "^4.0.2"
  brace-expansion: "^5.0.7"
  ws: "^8.21.0"
  "undici@7": "^7.29.0"
  "nanoid@3": "^3.3.18"
  "nanoid@5": "^5.1.16"
  # 2026-08-27 dependabot wave. yaml/otel/@astrojs-node are same-major.
  # deepmerge-ts 7->8 is the ONE cross-major exception to the header rule:
  # its only consumer is @prisma/config via better-auth's OPTIONAL prisma
  # adapter — we run the drizzle adapter, so that code path never executes.
  "yaml@2": "^2.8.4"
  "@opentelemetry/core@2": "^2.8.0"
  "@astrojs/node": "^11.0.2"
  deepmerge-ts: "^8.0.0"
  # drizzle-kit's deprecated @esbuild-kit subtree pins esbuild 0.18 (dev-server
  # CORS advisory GHSA-67mh-4wv8-2f99, dev-only). 0.25 keeps the transform API
  # that subtree uses.
  "@esbuild-kit/core-utils>esbuild": "^0.25.12"
  "js-yaml@4": "^4.3.1"
  "vite@7": "^7.3.6"
  react-router: "^7.18.2"
  socket.io-parser: "^4.2.7"
  engine.io: "^6.6.7"
  postcss: "^8.5.18"
  sharp: "^0.35.0"

# Native-binary / postinstall builds we trust under pnpm 11's
# strictDepBuilds default. Anything not listed here is silently ignored.
allowBuilds:
  # Test-only local Postgres for the createTestHarness spike
  # (openspec/changes/system-test-harness-spike) — unpacks the zonky
  # PostgreSQL 16 binaries on machines without Docker. CI runs on
  # ubuntu-latest (linux-x64); omitting that optional dep fails
  # `pnpm install --frozen-lockfile` with ERR_PNPM_IGNORED_BUILDS.
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-x64': true
  esbuild: true # Vite / Astro bundler — installs platform binary
  msw: true # Test mocking — sets up service worker
  protobufjs: true # Transitive — codegens long.js descriptors
  sharp: true # Astro image optimization — native libvips binding
  workerd: true # wrangler dev runtime — backend won't boot without it

# Supply-chain protection: only install package versions that have been
# public for at least 7 days (10080 minutes). Lets newly compromised
# versions be discovered and yanked before we pick them up.
minimumReleaseAge: 10080

# Packages excluded from the minimumReleaseAge gate. Two reasons land
# packages here: (a) registry metadata is missing the `time` field that the
# policy needs to compute age, or (b) we deliberately want to track newer
# vendor releases. The age policy still applies to the rest of the
# dependency tree.
# - @trigger.dev/*: vendor releases land faster than 7 days and at least
#   one package (@trigger.dev/build) ships without the `time` metadata.
#   The whole namespace is excluded so transitives (@trigger.dev/core etc.)
#   resolve cleanly. SDK pinned at 4.4.6 in apps/server + apps/workflows.
# Future pin bumps should re-check whether the exclusion is still needed.
minimumReleaseAgeExclude:
  - "@trigger.dev/*"
  # - vscode-languageserver*: transitives of @astrojs/check (the Astro
  #   typechecker, a build-time dev tool) whose registry metadata omits the
  #   `time` field, so the age policy can't compute their age and hard-fails
  #   the install. Excluded so apps/* can add @astrojs/check for `astro check`.
  - "vscode-languageserver"
  - "vscode-languageserver-types"
